openapi: 3.0.0
info:
  title: Platrium Core API
  version: 0.0.0
tags:
  - name: Files
paths:
  /auth/authorize:
    post:
      operationId: Auth_authorize
      summary: Authorize a Client
      description: Called by the web consent page once the signed-in user approves a native client or app. Stores a single-use code bound to the PKCE challenge and returns the URL to send the user back to. Browser session only. Include platform to register the client as a device.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth.AuthorizeResponse'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors.BadRequest'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors.Unauthorized'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors.Forbidden'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors.EngineInternal'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Auth.AuthorizeRequest'
  /auth/clients:
    get:
      operationId: Auth_list_clients
      summary: List Devices and Apps
      description: Lists the devices and apps signed in as the current user.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth.ClientListResponse'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors.Unauthorized'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors.EngineInternal'
    post:
      operationId: Auth_create_client
      summary: Create App Token
      description: Manually creates a named app token for scripts and CI. The token is only returned here. Browser session only.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth.TokenResponse'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors.BadRequest'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors.Unauthorized'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors.Forbidden'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors.EngineInternal'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Auth.CreateClientRequest'
  /auth/clients/{id}:
    delete:
      operationId: Auth_delete_client
      summary: Revoke Device or App
      description: Deletes the token and, for a device, the device with it. Takes effect immediately.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors.Unauthorized'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors.NotFound'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors.EngineInternal'
  /auth/device/push:
    put:
      operationId: Auth_set_push
      summary: Register Push Token
      description: Registers the APNs or FCM token for the device that owns the calling bearer token.
      parameters: []
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors.BadRequest'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors.Unauthorized'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors.Forbidden'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors.EngineInternal'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Auth.PushRequest'
    delete:
      operationId: Auth_clear_push
      summary: Clear Push Token
      description: Stops push delivery to the device that owns the calling bearer token.
      parameters: []
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors.Unauthorized'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors.Forbidden'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors.EngineInternal'
  /auth/login:
    post:
      operationId: Auth_local_user_login
      summary: Local Login
      description: Authenticates a user via credentials against a specific IdP and establishes a session or issues a challenge.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth.LoginResponse'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors.Unauthorized'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors.EngineInternal'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Auth.LoginRequest'
    get:
      operationId: Auth_idp_redirect
      summary: SSO Login Redirect
      description: Initiates an external SSO handshake (SAML/OIDC) and redirects the user.
      parameters:
        - name: idp
          in: query
          required: true
          schema:
            type: string
          explode: false
      responses:
        '302':
          description: Redirection
          headers:
            location:
              required: true
              schema:
                type: string
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors.NotFound'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors.EngineInternal'
  /auth/logout:
    post:
      operationId: Auth_logout
      summary: Log Out
      description: 'Ends the current credential: deletes the calling bearer token (and its device), or destroys the browser session.'
      parameters: []
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors.EngineInternal'
  /auth/me:
    get:
      operationId: Auth_me
      summary: Get Current User
      description: Returns the currently authenticated user's session data.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth.AuthMeResponse'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors.Unauthorized'
  /auth/mfa/verify:
    post:
      operationId: Auth_verify
      summary: Verify MFA Challenge
      description: Verifies an MFA challenge token and establishes a session.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth.LoginResponse'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors.Unauthorized'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors.EngineInternal'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Auth.MFAVerifyRequest'
  /auth/token:
    post:
      operationId: Auth_token
      summary: Exchange Code for Token
      description: Redeems the single-use code from /authorize together with the PKCE code_verifier and returns a bearer token. Rate limited.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth.TokenResponse'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors.BadRequest'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors.EngineInternal'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Auth.TokenRequest'
  /files/downloadsession/chunks:
    post:
      operationId: DownloadSession_chunks
      summary: Presign a batch of chunks for download
      description: Generates time-bound client-direct download URLs for specific file chunk indices using a download session token.
      parameters:
        - name: x-platrium-downloadsession
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Files.DownloadSessionChunksResponse'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors.Unauthorized'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors.EngineInternal'
      tags:
        - Files
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Files.DownloadSessionChunksRequest'
  /files/downloadsession/init:
    post:
      operationId: DownloadSession_initialize
      summary: Initialize a new download session
      description: Initialize a file download session. Verifies file ACLs and returns a sealed download session token and metadata.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Files.DownloadSessionInitResponse'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors.NotFound'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors.EngineInternal'
      tags:
        - Files
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Files.DownloadSessionInitRequest'
  /files/uploadsession/chunks:
    post:
      operationId: UploadSession_chunks
      summary: Presign a batch of chunks for upload
      description: Batch request presigned URLs and cryptographic authorization receipts for chunk uploading.
      parameters:
        - name: x-platrium-uploadsession
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Files.UploadSessionChunksResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors.EngineInternal'
      tags:
        - Files
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Files.UploadSessionChunksRequest'
  /files/uploadsession/commit:
    post:
      operationId: UploadSession_commit
      summary: Commit an upload session and finalize the file
      description: Commit an upload session and finalize the file layout using the provided cryptographic receipts.
      parameters:
        - name: x-platrium-uploadsession
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Files.UploadSessionCommitResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors.EngineInternal'
      tags:
        - Files
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Files.UploadSessionCommitRequest'
  /files/uploadsession/init:
    post:
      operationId: UploadSession_initialize
      summary: Initialize a new upload session
      description: Initialize a file upload session. Verifies destination folder ACLs and returns a sealed passport token.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Files.UploadSessionInitResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors.EngineInternal'
      tags:
        - Files
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Files.UploadSessionInitRequest'
components:
  schemas:
    Auth.AuthMeResponse:
      type: object
      required:
        - user_id
        - tenant_id
        - email
        - auth_kind
      properties:
        user_id:
          type: string
        tenant_id:
          type: string
        email:
          type: string
        auth_kind:
          type: string
          enum:
            - SESSION
            - DEVICE
            - APP
          description: 'How this request authenticated: SESSION (browser), DEVICE or APP (bearer token).'
        device_id:
          type: string
          description: Set when auth_kind is DEVICE.
    Auth.AuthorizeRequest:
      type: object
      required:
        - redirect_uri
        - code_challenge
        - name
      properties:
        redirect_uri:
          type: string
          description: 'Where to send the user afterwards: a custom URL scheme, a loopback http URL (127.0.0.1, [::1], localhost, any port), or a configured https universal link.'
        code_challenge:
          type: string
          description: Base64url SHA-256 of the client's secret code_verifier (PKCE S256).
        state:
          type: string
          description: Opaque client value echoed back on the redirect.
        name:
          type: string
          description: Shown to the user and in the Devices/Apps list, e.g. "Platrium for iPhone" or "Platrium CLI".
        platform:
          type: string
          description: IOS, MACOS, ANDROID, ... When present the client is registered as a device; when absent it is an app.
        app_version:
          type: string
    Auth.AuthorizeResponse:
      type: object
      required:
        - redirect_to
      properties:
        redirect_to:
          type: string
    Auth.Client:
      type: object
      required:
        - id
        - kind
        - name
        - created_at
        - last_used_at
        - current
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
            - DEVICE
            - APP
        name:
          type: string
        platform:
          type: string
        app_version:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        current:
          type: boolean
          description: True for the credential making this request.
    Auth.ClientListResponse:
      type: object
      required:
        - clients
      properties:
        clients:
          type: array
          items:
            $ref: '#/components/schemas/Auth.Client'
    Auth.CreateClientRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        expires_in_days:
          type: integer
          format: int32
          description: Lifetime in days; omit for a token that only expires when idle.
    Auth.LoginRequest:
      type: object
      required:
        - idp_id
        - email
      properties:
        idp_id:
          type: string
        email:
          type: string
        password:
          type: string
    Auth.LoginResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
        next_step:
          type: string
        challenge_token:
          type: string
        available_methods:
          type: array
          items:
            type: string
          minItems: 1
    Auth.MFAVerifyRequest:
      type: object
      required:
        - challenge_token
        - method
        - code
      properties:
        challenge_token:
          type: string
        method:
          type: string
        code:
          type: string
    Auth.PushRequest:
      type: object
      required:
        - transport
        - token
      properties:
        transport:
          type: string
          enum:
            - APNS
            - FCM
        token:
          type: string
    Auth.TokenRequest:
      type: object
      required:
        - code
        - code_verifier
      properties:
        code:
          type: string
        code_verifier:
          type: string
    Auth.TokenResponse:
      type: object
      required:
        - token
        - id
      properties:
        token:
          type: string
          description: Bearer token. Only shown once.
        id:
          type: string
          description: Token ID, usable with DELETE /auth/clients/{id}.
        device_id:
          type: string
        expires_at:
          type: string
          format: date-time
    Errors.BadRequest:
      type: object
      properties:
        message:
          type: string
    Errors.EngineInternal:
      type: object
      required:
        - debuginfo
      properties:
        debuginfo:
          type: string
    Errors.Forbidden:
      type: object
      properties:
        message:
          type: string
    Errors.MissingChunks:
      type: object
      required:
        - missing_chunks
      properties:
        missing_chunks:
          type: array
          items:
            type: string
    Errors.NotFound:
      type: object
      properties:
        message:
          type: string
    Errors.Unauthorized:
      type: object
      properties:
        message:
          type: string
    Files.ChunkHash:
      type: string
      pattern: ^[a-f0-9]{64}$
      description: Strict SHA-256 Hex Hash validation pattern (64 characters, lowercase hex)
    Files.DownloadSessionChunksRequest:
      type: object
      required:
        - indices
      properties:
        indices:
          type: array
          items:
            type: integer
            format: int32
          minItems: 1
          maxItems: 512
          description: Batch of chunk indices to request presigned download URLs for. Capped at 512 items.
    Files.DownloadSessionChunksResponse:
      type: object
      required:
        - chunks
      properties:
        chunks:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Files.DownloadSessionPresignedChunk'
          description: A key-value map mapping each requested index (as string) to its presigned chunk download details.
    Files.DownloadSessionInitRequest:
      type: object
      required:
        - file_id
      properties:
        file_id:
          type: string
          description: ID of the file to download
        version:
          type: string
          description: Optional file version to target. If not provided, the latest version is used.
    Files.DownloadSessionInitResponse:
      type: object
      required:
        - session_id
        - file_name
        - file_size
        - mime_type
      properties:
        session_id:
          type: string
          description: Cryptographically sealed JWT token acting as the download passport
        file_name:
          type: string
          description: Name of the file
        file_size:
          type: integer
          format: int64
          description: Total size of the file in bytes
        mime_type:
          type: string
          description: MIME Content-Type of the file
    Files.DownloadSessionPresignedChunk:
      type: object
      required:
        - download_url
      properties:
        download_url:
          type: string
          description: The client-direct Presigned download URL for the chunk.
    Files.UploadSessionChunksRequest:
      type: object
      required:
        - hashes
      properties:
        hashes:
          type: array
          items:
            $ref: '#/components/schemas/Files.ChunkHash'
          minItems: 1
          maxItems: 512
          description: Batch of SHA-256 chunk hashes to authorize. Capped at 512 items (2GiB window).
        contains_eof_chunk:
          type: boolean
          description: Flag indicating if last element in hashes is the last (EOF) chunk in the file. Allows Chunk to be < 4MiB.
    Files.UploadSessionChunksResponse:
      type: object
      required:
        - chunks
      properties:
        chunks:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Files.UploadSessionPresignedChunk'
          description: A key-value map mapping each authorized ChunkHash string directly to its metadata and receipts.
    Files.UploadSessionCommitChunk:
      type: object
      required:
        - hash
        - receipt
      properties:
        hash:
          allOf:
            - $ref: '#/components/schemas/Files.ChunkHash'
          description: SHA-256 Hash of Chunk Previously used to obtain Presign Status
        receipt:
          type: string
          description: Cryptographic HMAC receipt authorized by the server for this chunk
    Files.UploadSessionCommitRequest:
      type: object
      required:
        - chunks
      properties:
        chunks:
          type: array
          items:
            $ref: '#/components/schemas/Files.UploadSessionCommitChunk'
          minItems: 1
          maxItems: 524288
          description: Strictly ordered list of chunks forming the master file manifest sequence. Max items support a 2TiB file.
    Files.UploadSessionCommitResponse:
      type: object
      required:
        - file_id
      properties:
        file_id:
          type: string
          description: The created FileNode ID
    Files.UploadSessionInitRequest:
      type: object
      required:
        - parent_id
        - file_name
        - file_size
        - mime_type
      properties:
        parent_id:
          type: string
          description: ID of the parent folder or drive
        file_name:
          type: string
          description: Name of the file
        file_size:
          type: integer
          format: int64
          minimum: 1
          maximum: 2199023255552
          description: Size of the file in bytes. Max size 2TiB.
        mime_type:
          type: string
          description: MIME Content-Type of the file (e.g. application/pdf, image/png)
    Files.UploadSessionInitResponse:
      type: object
      required:
        - session_id
      properties:
        session_id:
          type: string
          description: Cryptographically sealed JWT token acting as the session_id passport
    Files.UploadSessionPresignedChunk:
      type: object
      required:
        - upload_url
        - receipt
      properties:
        upload_url:
          type: string
          nullable: true
          description: The client-direct Presigned upload URL. Null if the chunk already exists.
        receipt:
          type: string
          description: Symmetric HMAC authorization receipt bound to this specific session and chunk.
servers:
  - url: http://localhost:3000/api
    description: Local development server
    variables: {}
